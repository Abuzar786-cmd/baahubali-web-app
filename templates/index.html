<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahishmati War Room v3.0</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .war-room-container {
            text-align: center;
            padding: 30px;
            background: linear-gradient(145deg, #161616, #1f1405);
            border: 2px solid #d4af37;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            max-width: 550px;
            width: 100%;
        }

        @keyframes float3D {
            0% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(10deg); }
            100% { transform: translateY(0px) rotateY(0deg); }
        }

        .mahishmati-crest {
            font-size: 2rem;
            font-weight: bold;
            color: #d4af37;
            text-shadow: 0 5px 20px rgba(212, 175, 55, 0.6);
            transform-style: preserve-3d;
            perspective: 1000px;
            animation: float3D 4s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        .card-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .card-section h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 1.1rem;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 0.9rem;
            color: #ccc;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #d4af37;
            background-color: #1a1a1a;
            color: #fff;
            margin-bottom: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .track-display {
            font-size: 1.1rem;
            color: #ffd700;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="war-room-container">
        <div class="mahishmati-crest">
            ⚔️ MAHISHMATI WAR ROOM ⚔️
        </div>

        <!-- Section 1: Warrior & Soundtrack Selection -->
        <div class="card-section">
            <h3>🛡️ Select Active Warrior & Theme</h3>
            <label for="trackSelect">Choose Sound Track:</label>
            <select id="trackSelect" onchange="changeTrack()">
                {% for track in tracks %}
                    <option value="{{ url_for('static', filename='audio/' + track.filename) }}" data-warrior="{{ track.warrior }}" data-theme="{{ track.theme }}">
                        {{ track.warrior }} - {{ track.theme }}
                    </option>
                {% endfor %}
            </select>

            <div class="track-display">
                <div id="displayWarrior">Warrior: Amarendra Baahubali</div>
                <div id="displayTheme">Theme: Mahishmati Royal Anthem</div>
            </div>

            <audio id="bgMusic" preload="auto">
                <source id="audioSource" src="{{ url_for('static', filename='audio/' + tracks[0].filename) if tracks else '' }}" type="audio/mpeg">
            </audio>

            <button onclick="toggleAudio()" id="playBtn" class="btn">🔊 Play Soundtrack</button>
        </div>

        <!-- Section 2: Custom Song & Warrior Upload -->
        <div class="card-section">
            <h3>🎺 Upload New Warrior Soundtrack</h3>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <label>Warrior Name:</label>
                <input type="text" name="warrior_name" placeholder="e.g. Bhallaladeva / Kattappa" required>

                <label>Theme Name:</label>
                <input type="text" name="theme_name" placeholder="e.g. March of the Elephant Guard" required>

                <label>Audio Track (.mp3):</label>
                <input type="file" name="audio_file" accept=".mp3,.wav" required>

                <button type="submit" class="btn" style="margin-top: 10px;">⬆️ Upload to War Room</button>
            </form>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const audioSource = document.getElementById('audioSource');
        const trackSelect = document.getElementById('trackSelect');

        function toggleAudio() {
            if (music.paused) {
                music.play().then(() => {
                    playBtn.innerText = "🔇 Pause Soundtrack";
                }).catch(error => console.log("Playback error:", error));
            } else {
                music.pause();
                playBtn.innerText = "🔊 Play Soundtrack";
            }
        }

        function changeTrack() {
            const selectedOption = trackSelect.options[trackSelect.selectedIndex];
            const audioUrl = selectedOption.value;
            const warrior = selectedOption.getAttribute('data-warrior');
            const theme = selectedOption.getAttribute('data-theme');

            document.getElementById('displayWarrior').innerText = "Warrior: " + warrior;
            document.getElementById('displayTheme').innerText = "Theme: " + theme;

            audioSource.src = audioUrl;
            music.load();
            if (!music.paused) {
                music.play();
            } else {
                playBtn.innerText = "🔊 Play Soundtrack";
            }
        }
    </script>

</body>
</html>
