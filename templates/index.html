<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahishmati War Room</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .war-room-container {
            text-align: center;
            padding: 40px;
            background: linear-gradient(145deg, #161616, #1f1405);
            border: 2px solid #d4af37;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            max-width: 500px;
            width: 90%;
        }

        @keyframes float3D {
            0% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-12px) rotateY(12deg); }
            100% { transform: translateY(0px) rotateY(0deg); }
        }

        .mahishmati-crest {
            font-size: 2.2rem;
            font-weight: bold;
            color: #d4af37;
            text-shadow: 0 5px 20px rgba(212, 175, 55, 0.6);
            transform-style: preserve-3d;
            perspective: 1000px;
            animation: float3D 4s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        p {
            color: #b3b3b3;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        #playBtn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #playBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div class="war-room-container">
        <div class="mahishmati-crest">
            ⚔️ MAHISHMATI WAR ROOM ⚔️
        </div>

        <p>Strategic command center operational. Soundtracks loaded.</p>

        <audio id="bgMusic" preload="auto">
            <source src="{{ url_for('static', filename='audio/theme_song.mp3') }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div>
            <button onclick="toggleAudio()" id="playBtn">🔊 Play Soundtrack</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');

        function toggleAudio() {
            if (music.paused) {
                music.play().then(() => {
                    playBtn.innerText = "🔇 Pause Soundtrack";
                }).catch(error => {
                    console.log("Playback prevented:", error);
                });
            } else {
                music.pause();
                playBtn.innerText = "🔊 Play Soundtrack";
            }
        }
    </script>

</body>
</html>
